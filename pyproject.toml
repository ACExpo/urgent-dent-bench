[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urgentdentbench"
version = "1.0.0"
description = "Safety-focused benchmark for AI clinical reasoning in dental urgent care"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0","pandas>=2.2","scikit-learn>=1.5","jsonschema>=4.23"]

[tool.setuptools.packages.find]
where = ["src"]
